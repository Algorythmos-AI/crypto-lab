[project]
name = "wt"
version = "0.1.0"
description = "Crypto Lab: crypto paper-trading desk on public market data and its own simulator, with a learning loop (paper only)"
requires-python = ">=3.12,<3.13"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# tests/ml runs in the ML environment by unittest (make test-ml, the `ml` check); it skips itself under pytest
# when that environment's libraries are absent.
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
markers = [
    "smoke: fast import and sanity checks that `make deploy` runs against the live venv",
]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["data", "var", "build", "logs", ".parity", "tools/from-monorepo/overlay"]

[tool.ruff.lint]
# Bug-class rules only, as in the repository this desk came from: import sorting (I) and pyupgrade (UP) would
# rewrite the desk's code, which stays byte-identical to its origin until the cutover is done.
select = ["E9", "F", "B"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
ignore_missing_imports = true
warn_unused_configs = true
# Only the modules named on the command line are held to --strict; modules they import are read, not reported.
follow_imports = "silent"
